[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-analyst"
version = "0.1.0"
description = "Aplicação desktop local-first para análise interativa de dados de cibersegurança."
requires-python = ">=3.12"
dependencies = ["PySide6", "polars", "duckdb"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
